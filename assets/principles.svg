<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 272" width="880" height="272" role="img" aria-label="Build principles: 01 Make the idea tangible. 02 Give the interface a point of view. 03 Build the smallest useful system. 04 Let technology serve the experience. 05 Treat depth as communication. 06 Ship, observe, refine.">
<title>Build principles — lord-saviord1</title>
<style>
  text{font-family:Consolas, 'Cascadia Mono', SFMono-Regular, Menlo, 'Liberation Mono', 'Courier New', monospace;font-size:15px}
  .t{font-size:12px}
  .ap{animation:ap .25s ease-out both}
  @keyframes ap{from{opacity:0}to{opacity:1}}
  .cover{transform-box:fill-box;transform-origin:100% 50%;transform:scaleX(0);animation-name:wipe;animation-fill-mode:both}
  @keyframes wipe{from{transform:scaleX(1)}to{transform:scaleX(0)}}
  .cursor{animation:ap .25s ease-out both,blink 1.1s steps(1,end) infinite}
  @keyframes blink{0%{opacity:1}50%{opacity:0}}
  .card{animation:ap .4s ease-out both}
  @media (prefers-reduced-motion:reduce){.cover,.cursor,.ap,.card{animation:none}.cover{transform:scaleX(0)}.cursor{opacity:1}}
</style>

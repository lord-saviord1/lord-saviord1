---
name: Update repository telemetry

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
  push:
    paths:
      - '.github/workflows/update-telemetry.yml'
      - 'telemetry/projects.json'
      - 'telemetry/generate-telemetry.js'
      - 'telemetry/generate-svg.js'
      - 'telemetry/README.md'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]' || github.event_name != 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node telemetry/generate-telemetry.js

      # NEW: draws assets/telemetry.svg from the data.json written above.
      - name: Render telemetry graphic
        run: node telemetry/generate-svg.js

      - name: Commit generated telemetry
        if: github.ref_name == github.event.repository.default_branch
        run: |
          if [ -z "$(git status --porcelain README.md telemetry/data.json telemetry/README.generated.md assets/telemetry.svg)" ]; then
            echo "No telemetry changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md telemetry/data.json telemetry/README.generated.md assets/telemetry.svg
          git commit -m "chore(telemetry): auto-update generated dashboard [skip ci]"
          git push
